<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plutus Wire</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #16181d;
      }
      body {
        margin: 0;
        padding: 40px;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
      }
      h1 {
        font-size: 34px;
        line-height: 1.1;
        margin: 0 0 10px;
      }
      p {
        color: #4f5662;
        line-height: 1.55;
      }
      .panel {
        margin-top: 28px;
        border: 1px solid #d9dde5;
        border-radius: 8px;
        background: #fff;
        padding: 22px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #2f5d45;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2f9d62;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Plutus Wire</h1>
      <p>Local-first intelligence wire for your own X timeline.</p>
      <section class="panel">
        <div class="status"><span class="dot"></span><span>Scaffold ready</span></div>
        <p>The review surface will show selected sources, run health, and signal cards here.</p>
      </section>
    </main>
  </body>
</html>
